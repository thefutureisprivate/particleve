[Unit]
Requires=particleve-runtime-ready.service systemd-nsresourced.socket
After=particleve-runtime-ready.service systemd-nsresourced.socket
RequiresMountsFor=/var /var/lib/machines
ConditionPathExists=!/run/particleve/vm-start-inhibited

[Service]
ExecStart=
ExecStart=/usr/libexec/particleve-vm-run %i /usr/bin/systemd-vmspawn --quiet --register=yes --keep-unit --network-tap --machine=%i
ExecStartPre=/usr/libexec/particleve-vm-start-guard %i
ExecStop=/usr/libexec/particleve-vm-stop %i
NotifyAccess=all
ExitType=cgroup
TimeoutStartSec=infinity
TimeoutStopSec=infinity
TimeoutAbortSec=infinity
KillMode=mixed
KillSignal=SIGTERM
WatchdogSignal=SIGTERM
SendSIGKILL=no
RuntimeDirectory=particleve-vm/%i
RuntimeDirectoryMode=0700
Environment=TMPDIR=/run/particleve-vm/%i
Environment=PATH=/usr/libexec/particleve-qemu:/usr/sbin:/usr/bin
Environment=XDG_CONFIG_HOME=/run/particleve-vm/%i/config
BindPaths=/run/particleve-vm/%i:/tmp
BindPaths=/run/particleve-vm/%i:/var/tmp
# Native nsresourced passes a TAP descriptor; QEMU needs no host network administration.
CapabilityBoundingSet=~CAP_NET_ADMIN
# Native interactive/read-only consoles allocate a PTY; char-pts alone omits its multiplexer.
DeviceAllow=/dev/ptmx rw
