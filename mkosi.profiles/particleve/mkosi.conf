# Native headless profile for the ParticleVE fork.
[Config]
MinimumVersion=27.1

[Distribution]
Distribution=fedora
Release=45
Architecture=x86-64
RepositoryKeyCheck=yes

[Build]
ToolsTree=default
ToolsTreeDistribution=fedora
ToolsTreeRelease=45
ToolsTreeProfiles=
ToolsTreeProfiles=runtime,misc

[Output]
ImageId=ParticleVE
Output=ParticleVE_%v_%a
SplitArtifacts=uki,partitions,os-release,roothash,initrd
ManifestFormat=json

[Content]
UnifiedKernelImageFormat=ParticleVE_%v_%a
WithRecommends=no
Packages=
Packages=acl attr audit authselect bash bash-completion ca-certificates coreutils cryptsetup curl dbus-broker
         dosfstools e2fsprogs efibootmgr erofs-utils fedora-release file findutils fwupd fwupd-efi
         gdisk glibc-minimal-langpack grep hostname particleve-integration
         integritysetup iproute iputils jq kernel-core kernel-modules kernel-modules-extra kmod
         linux-firmware amd-ucode-firmware btrfs-progs mdadm microcode_ctl nano nftables nvme-cli openssh-server openssh-clients
         openssl pam passwd pciutils polkit policycoreutils procps-ng python3 qemu-img qemu-kvm-core
         libfido2 fido2-tools
         edk2-ovmf swtpm virtiofsd rpm sbsigntools sed selinux-policy-targeted
          smartmontools systemd systemd-boot systemd-container systemd-networkd
         systemd-pam systemd-resolved systemd-ukify systemd-udev
         tar tpm2-tools tpm2-tss tzdata udisks2 util-linux veritysetup
         wireguard-tools xz zstd gnupg2
VolatilePackages=
VolatilePackages=systemd systemd-boot systemd-container systemd-networkd systemd-pam systemd-resolved
                 systemd-ukify systemd-udev
InitrdProfiles=
InitrdProfiles=raid
InitrdPackages=cryptsetup mdadm btrfs-progs jq tpm2-tools tpm2-tss libfdisk
InitrdVolatilePackages=
InitrdVolatilePackages=systemd systemd-udev
KernelModules=
KernelModules=/.*/
KernelInitrdModules=
KernelInitrdModules=default /drivers/ata /drivers/nvme /drivers/scsi /drivers/md
                    /drivers/mmc /drivers/ufs /drivers/virtio /drivers/char/tpm
                    /drivers/usb/storage /drivers/usb/host /drivers/net/ethernet /fs/btrfs /fs/erofs /crypto
KernelModulesIncludeHost=no
KernelModulesInitrdIncludeHost=no
MicrocodeHost=no
FirmwareFiles=*
UnifiedKernelImageProfiles=
KernelCommandLine=
KernelCommandLine=root=LABEL=ParticleVE-root mount.usr=dissect rw audit=1 enforcing=1
                  zswap.enabled=1 systemd.gpt_auto=1
                  rd.systemd.mask=systemd-repart.service systemd.mask=systemd-repart.service
                  systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:=ignore
                  systemd.image_filter=usr=ParticleVE_*:usr-verity=ParticleVE_*:usr-verity-sig=ParticleVE_*
                  console=tty0
RootShell=/bin/bash
RootPassword=hashed:!
Hostname=

[Validation]
SecureBoot=yes
SignExpectedPcr=yes

[Runtime]
Credentials=
