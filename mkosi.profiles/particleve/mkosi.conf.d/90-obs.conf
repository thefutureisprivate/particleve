# Native OBS deferred signing; local builds retain normal mkosi key handling.
[Match]
PathExists=/usr/src/packages/SOURCES/_projectcert.crt

[Include]
Include=mkosi-obs

[Build]
# OBS supplies the complete dependency closure through its authenticated local
# mirror. Do not contact the online repositories inside the offline worker.
SandboxTrees=
SandboxTrees=/usr/src/packages/SOURCES:/usr/src/packages/SOURCES

[Content]
PostOutputScripts=%D/tools/obs-postoutput

[Output]
CompressOutput=no
